
services:
  postgres:
    image: postgres:16
    container_name: pfa_postgres
    environment:
      POSTGRES_DB: marches_publics
      POSTGRES_USER: adil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  chromadb:
    image: chromadb/chroma:latest
    container_name: pfa_chromadb
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  chroma_data:

